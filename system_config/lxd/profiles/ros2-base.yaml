description: Common ROS2 Jazzy settings for all teleop LXD containers
config:
  environment.ROS_DOMAIN_ID: "42"
  environment.RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  environment.CYCLONEDDS_URI: file:///etc/cyclonedds/cyclonedds.xml
  boot.autostart: "true"
devices:
  cyclonedds:
    type: disk
    source: /etc/cyclonedds/lxd
    path: /etc/cyclonedds
    readonly: "true"
