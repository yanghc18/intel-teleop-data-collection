controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    # One broadcaster per hardware component: a failing component only stops its own /joint_states.
    left_arm_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    right_arm_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_hand_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    right_hand_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # mode:=manual - jogging (rqt_joint_trajectory_controller), later MoveIt / replay.
    left_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_hand_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_hand_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # mode:=teleop - streaming position commands from teleop_safety.
    left_arm_controller:
      type: position_controllers/JointGroupPositionController
    right_arm_controller:
      type: position_controllers/JointGroupPositionController
    left_gripper_controller:
      type: position_controllers/JointGroupPositionController
    right_gripper_controller:
      type: position_controllers/JointGroupPositionController

left_arm_state_broadcaster:
  ros__parameters:
    update_rate: 500
    joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3, openarm_left_joint4,
             openarm_left_joint5, openarm_left_joint6, openarm_left_joint7]
    interfaces: [position, velocity, effort]

right_arm_state_broadcaster:
  ros__parameters:
    update_rate: 500
    joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3, openarm_right_joint4,
             openarm_right_joint5, openarm_right_joint6, openarm_right_joint7]
    interfaces: [position, velocity, effort]

left_hand_state_broadcaster:
  ros__parameters:
    update_rate: 500
    joints: [lh_thumb_cmc_yaw, lh_thumb_cmc_pitch, lh_index_mcp_pitch,
             lh_middle_mcp_pitch, lh_ring_mcp_pitch, lh_pinky_mcp_pitch]
    interfaces: [position, velocity]

right_hand_state_broadcaster:
  ros__parameters:
    update_rate: 500
    joints: [rh_thumb_cmc_yaw, rh_thumb_cmc_pitch, rh_index_mcp_pitch,
             rh_middle_mcp_pitch, rh_ring_mcp_pitch, rh_pinky_mcp_pitch]
    interfaces: [position, velocity]

left_arm_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true

right_arm_trajectory_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true

left_hand_trajectory_controller:
  ros__parameters:
    joints:
      - lh_thumb_cmc_yaw
      - lh_thumb_cmc_pitch
      - lh_index_mcp_pitch
      - lh_middle_mcp_pitch
      - lh_ring_mcp_pitch
      - lh_pinky_mcp_pitch
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true

right_hand_trajectory_controller:
  ros__parameters:
    joints:
      - rh_thumb_cmc_yaw
      - rh_thumb_cmc_pitch
      - rh_index_mcp_pitch
      - rh_middle_mcp_pitch
      - rh_ring_mcp_pitch
      - rh_pinky_mcp_pitch
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true

left_arm_controller:
  ros__parameters:
    joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3, openarm_left_joint4,
             openarm_left_joint5, openarm_left_joint6, openarm_left_joint7]

right_arm_controller:
  ros__parameters:
    joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3, openarm_right_joint4,
             openarm_right_joint5, openarm_right_joint6, openarm_right_joint7]

left_gripper_controller:
  ros__parameters:
    joints: [lh_thumb_cmc_yaw, lh_thumb_cmc_pitch, lh_index_mcp_pitch,
             lh_middle_mcp_pitch, lh_ring_mcp_pitch, lh_pinky_mcp_pitch]

right_gripper_controller:
  ros__parameters:
    joints: [rh_thumb_cmc_yaw, rh_thumb_cmc_pitch, rh_index_mcp_pitch,
             rh_middle_mcp_pitch, rh_ring_mcp_pitch, rh_pinky_mcp_pitch]
